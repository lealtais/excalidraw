name: Deploy Excalidraw to GitHub Pages

on:
  push:
    branches:
      - master # ou main, dependendo do branch principal do seu fork

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Instalar dependências
        run: yarn --frozen-lockfile

      - name: Gerar Build de Produção
        run: yarn build:app:gh-pages

      - name: Upload do artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./excalidraw-app/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
